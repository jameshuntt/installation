[package]
name = "installation"
version = "0.2.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
description = "Install a built binary the honest way: plan first, install from the plan, keep a receipt, uninstall from the receipt. Paths come from pathgen."
authors = ["James Hunt <james@1o.business>"]
repository = "https://github.com/jameshuntt/installation"
keywords = ["install", "binary", "cargo", "path", "xdg"]
categories = ["command-line-utilities", "filesystem"]
readme = "README.md"

[dependencies]
pathgen = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "6"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
